<text x="26.0" y="86.0" xml:space="preserve">
<tspan style="color:#e6edf3;" font-weight="700" >expression</tspan><tspan style="color:#c9d1d9;" > */5 9-17 * * 1-5</tspan></text>
<text x="26.0" y="128.0" xml:space="preserve">
<tspan style="color:#c9d1d9;" >  </tspan><tspan style="color:rgb(102,0,153);" >minute       </tspan><tspan style="color:#c9d1d9;" >  every 5 minutes</tspan></text>
