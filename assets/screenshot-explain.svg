<tspan style="color:#c9d1d9;" >  </tspan><tspan style="color:rgb(102,0,153);" >hour         </tspan><tspan style="color:#c9d1d9;" >  at hour 09:00-17:00</tspan></text>
<text x="26.0" y="170.0" xml:space="preserve">
<tspan style="color:#c9d1d9;" >  </tspan><tspan style="color:rgb(102,0,153);" >day-of-month </tspan><tspan style="color:#c9d1d9;" >  every day of the month</tspan></text>
